---
- name: Version installée
  ansible.builtin.command: "grep -oP '^VERSION=\\K.*' {{ splunk_home }}/etc/splunk.version"
  register: _cur_version
  changed_when: false

- name: Upgrade nécessaire
  when: _cur_version.stdout != splunk_version
  block:
    - name: Paquet (contrôleur Ansible)
      ansible.builtin.copy:
        src: "{{ splunk_package }}"
        dest: "/tmp/{{ splunk_package }}"
        mode: "0644"
      when: splunk_download_from == 'local'

    - name: Paquet (Artifactory)
      ansible.builtin.get_url:
        url: "{{ artifactory_url }}/{{ artifactory_repo }}/splunk/{{ splunk_package }}"
        dest: "/tmp/{{ splunk_package }}"
        mode: "0644"
      when: splunk_download_from == 'artifactory'

    - name: Sauvegarde de etc/
      community.general.archive:
        path: "{{ splunk_home }}/etc"
        dest: "/var/tmp/splunk-etc-{{ _cur_version.stdout }}-{{ ansible_date_time.epoch }}.tar.gz"
        mode: "0600"

    - name: Arrêt de Splunk
      ansible.builtin.systemd:
        name: "{{ splunk_service }}"
        state: stopped

    - name: Extraction de la nouvelle version par-dessus l'ancienne
      ansible.builtin.unarchive:
        src: "/tmp/{{ splunk_package }}"
        dest: /opt
        remote_src: true
        owner: "{{ splunk_user }}"
        group: "{{ splunk_user }}"

    # Avec boot-start systemd, "splunk start" en root délègue à systemctl ; la migration
    # de configuration est exécutée au démarrage (à vérifier dans le lab sur ta version).
    - name: Démarrage + migration
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk start --accept-license --answer-yes --no-prompt"
      changed_when: true

    - name: Attente du port de management
      ansible.builtin.wait_for:
        port: "{{ splunk_mgmt_port }}"
        delay: 10
        timeout: 600

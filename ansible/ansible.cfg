[defaults]
inventory          = inventories/lab/hosts.yml
roles_path         = roles
remote_user        = ansible
host_key_checking  = False
forks              = 20
stdout_callback    = yaml
retry_files_enabled = False
# Affiche la durée de chaque tâche : utile pour optimiser un déploiement
callbacks_enabled  = profile_tasks

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True

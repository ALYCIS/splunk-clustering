# =============================================================================
# Kafka (topic app-logs) -> transformation -> Splunk HEC (via LB HAProxy)
# Variables ${...} : /etc/sysconfig/logstash (généré par Ansible depuis Vault)
# =============================================================================
input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP}"
    topics            => ["app-logs"]
    group_id          => "logstash-splunk"      # consumer group : plusieurs Logstash se partagent les partitions
    client_id         => "logstash-${HOSTNAME:ls}"
    consumer_threads  => 3                      # <= nombre de partitions du topic
    auto_offset_reset => "earliest"
    codec             => "json"
    decorate_events   => "basic"                # ajoute [@metadata][kafka][topic/partition/offset]
  }
}

filter {
  # Horodatage métier (et non l'heure de lecture Kafka)
  date {
    match  => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Réduction du volume de licence : on ne transmet pas le DEBUG
  if [level] == "DEBUG" {
    drop { }
  }

  # Normalisation
  mutate {
    lowercase    => ["level"]
    add_field    => { "kafka_partition" => "%{[@metadata][kafka][partition]}" }
    remove_field => ["@version", "event", "timestamp"]
  }

  # Événement JSON complet envoyé comme corps de l'événement Splunk
  ruby {
    code => "
      h = event.to_hash.reject { |k, _| k.start_with?('@') }
      event.set('[@metadata][payload]', h.to_json)
    "
  }
}

output {
  http {
    url          => "${HEC_URL}/services/collector/event"
    http_method  => "post"
    format       => "message"
    content_type => "application/json"
    headers      => { "Authorization" => "Splunk ${HEC_TOKEN}" }
    # HEC attend : {"time": epoch, "host": ..., "index": ..., "sourcetype": ..., "event": {...}}
    message      => '{"time": %{+%s}, "host": "%{[host]}", "index": "app", "sourcetype": "app:json", "source": "kafka:app-logs", "event": %{[@metadata][payload]}}'
    ssl_verification_mode => "none"            # LAB : certificat Splunk par défaut
    retry_non_idempotent  => true
    automatic_retries     => 5
  }
}

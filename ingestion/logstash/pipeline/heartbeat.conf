# Heartbeat : un événement toutes les 30 s dans index=app_heartbeat.
# Une alerte Splunk (org_soc_monitoring) se déclenche s'il n'arrive plus :
# on supervise ainsi la chaîne Logstash -> LB -> HEC -> indexeurs de bout en bout.
input {
  heartbeat {
    interval => 30
    message  => "ok"
  }
}

output {
  http {
    url          => "${HEC_URL}/services/collector/event"
    http_method  => "post"
    format       => "message"
    content_type => "application/json"
    headers      => { "Authorization" => "Splunk ${HEC_TOKEN}" }
    message      => '{"time": %{+%s}, "host": "%{[host][name]}", "index": "app_heartbeat", "sourcetype": "logstash:heartbeat", "event": {"status": "ok", "pipeline": "heartbeat"}}'
    ssl_verification_mode => "none"
  }
}

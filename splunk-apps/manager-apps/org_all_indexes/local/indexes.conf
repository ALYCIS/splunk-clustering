# =============================================================================
# org_all_indexes : TOUS les index du cluster, déployés via etc/manager-apps.
# Ajouter un index = une merge request sur ce fichier => CI => AAP => apply cluster-bundle
# =============================================================================

# --- Volumes : plafonnent l'espace disque par tier de stockage ---
[volume:hot]
path = $SPLUNK_DB
maxVolumeDataSizeMB = 40000

[volume:cold]
path = $SPLUNK_DB
maxVolumeDataSizeMB = 10000

# --- [default] : attention, s'applique à TOUS les index de l'instance (internes compris),
# --- pas seulement à ceux de ce fichier.
[default]
# réplication dans le cluster (sinon : index NON répliqué !)
repFactor = auto
# 90 jours
frozenTimePeriodInSecs = 7776000
maxDataSize = auto

# --- Index applicatifs (Kafka -> Logstash -> HEC) ---
[app]
homePath   = volume:hot/app/db
coldPath   = volume:cold/app/colddb
thawedPath = $SPLUNK_DB/app/thaweddb

[app_heartbeat]
homePath   = volume:hot/app_heartbeat/db
coldPath   = volume:cold/app_heartbeat/colddb
thawedPath = $SPLUNK_DB/app_heartbeat/thaweddb
# 7 jours
frozenTimePeriodInSecs = 604800


# Réglages INDEX-TIME => doivent être sur les indexeurs (donc dans le cluster bundle).
#
# Rappel HEC : via /services/collector/event, l'événement arrive déjà découpé et son horodatage
# est le champ "time" du JSON HEC (fixé par Logstash). LINE_BREAKER / TIME_* ne s'appliquent
# qu'aux données passant par le parsing (/raw, S2S, fichiers). Les TRANSFORMS et SEDCMD
# s'appliquent en revanche (pipeline "typing").
[app:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 40

# Masquage de données sensibles avant écriture sur disque (RGPD / PCI) : numéros de carte
SEDCMD-mask_cb = s/\b(\d{4})\d{8}(\d{4})\b/\1XXXXXXXX\2/g

# Filtrage : les événements de health-check ne consomment ni licence ni disque
TRANSFORMS-drop_healthcheck = app_drop_healthcheck

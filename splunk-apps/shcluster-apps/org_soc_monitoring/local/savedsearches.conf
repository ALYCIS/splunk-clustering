# ---------------------------------------------------------------------------
# Alertes MCO : elles tournent sur le SHC (le captain les planifie)
# ---------------------------------------------------------------------------
[MCO - Source muette depuis plus de 30 min]
search = | tstats latest(_time) as last_seen where index=* index!=_* by index, sourcetype, host \
| eval minutes_silence = round((now() - last_seen) / 60) \
| where minutes_silence > 30 \
| sort - minutes_silence
cron_schedule = */15 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4

[MCO - Queues d'indexation bloquées]
search = index=_internal source=*metrics.log group=queue blocked=true \
| stats count by host, name \
| where count > 5
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 5

[MCO - Chaîne Kafka/Logstash : heartbeat absent]
search = | tstats count where index=app_heartbeat earliest=-5m \
| where count = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 5

[MCO - Erreurs HEC]
search = index=_internal sourcetype=splunkd component=HttpInputDataHandler log_level=ERROR \
| stats count by host, reply, message
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 3

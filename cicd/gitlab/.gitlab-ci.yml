# =============================================================================
# Pipeline de référence : repo splunk-clustering (playbooks + apps Splunk + pipelines Logstash)
#   MR     : lint + validation (aucun déploiement)
#   main   : package -> Artifactory -> déploiement DEV automatique via AAP
#   tag    : promotion REC (manuelle) puis PROD (manuelle, environnement protégé)
# Secrets : récupérés dans Vault par JWT GitLab (id_tokens), jamais en variable CI en clair.
# =============================================================================
stages: [lint, validate, package, publish, deploy]

variables:
  ARTIFACTORY_URL: "https://artifactory.example.local/artifactory"
  ARTIFACTORY_REPO: "splunk-apps-local"
  AAP_URL: "https://aap.example.local"
  VAULT_SERVER_URL: "https://vault.example.local:8200"
  VAULT_AUTH_ROLE: "gitlab-splunk"

default:
  # Version = tag Git si présent, sinon version de développement liée au commit
  before_script:
    - export APP_VERSION="${CI_COMMIT_TAG:-0.0.0-${CI_COMMIT_SHORT_SHA}}"

.vault_secrets: &vault_secrets
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "${VAULT_SERVER_URL}"
  secrets:
    ARTIFACTORY_TOKEN:
      vault: ci/artifactory/token@secret
      file: false
    AAP_TOKEN:
      vault: ci/aap/token@secret
      file: false

# ------------------------------------------------------------------- lint
yamllint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install -q yamllint
    - yamllint -d relaxed ansible/ cicd/

ansible-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install -q ansible-core ansible-lint
    - cd ansible && ansible-galaxy collection install -r requirements.yml
    - ansible-lint playbooks/ roles/

logstash-config-test:
  stage: lint
  image: docker.elastic.co/logstash/logstash:8.15.0
  variables:
    HEC_URL: "https://localhost:8088"
    HEC_TOKEN: "dummy"
    KAFKA_BOOTSTRAP: "localhost:9092"
  script:
    - for f in ingestion/logstash/pipeline/*.conf; do
        /usr/share/logstash/bin/logstash --config.test_and_exit -f "$f" || exit 1;
      done

# --------------------------------------------------------------- validate
# btool check dans un conteneur Splunk : erreurs de syntaxe / stanzas inconnues
splunk-btool:
  stage: validate
  image: splunk/splunk:9.4
  variables:
    SPLUNK_START_ARGS: "--accept-license"
  script:
    - cp -r splunk-apps/manager-apps/* splunk-apps/shcluster-apps/* /opt/splunk/etc/apps/
    - /opt/splunk/bin/splunk btool check --debug 2>&1 | tee btool.txt
    - "! grep -Ei 'Invalid key|No spec file' btool.txt | grep -E 'org_'"

appinspect:
  stage: validate
  image: python:3.12-slim
  script:
    - apt-get update -qq && apt-get install -y -qq libmagic1 >/dev/null
    - pip install -q splunk-appinspect
    - mkdir -p dist
    - for app in splunk-apps/*/org_*; do
        name=$(basename "$app"); tar czf "dist/${name}.tgz" -C "$(dirname "$app")" "$name";
        splunk-appinspect inspect "dist/${name}.tgz" --mode precert --excluded-tags cloud || exit 1;
      done

# ---------------------------------------------------------------- package
package-apps:
  stage: package
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p dist
    - for tier in manager-apps shcluster-apps deployment-apps; do
        for app in splunk-apps/$tier/org_*; do
          name=$(basename "$app");
          sed -i "s/^version = .*/version = ${APP_VERSION}/" "$app/default/app.conf";
          tar czf "dist/${tier}__${name}-${APP_VERSION}.tgz" -C "splunk-apps/$tier" "$name";
        done;
      done
    - sha256sum dist/*.tgz > dist/SHA256SUMS
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# ---------------------------------------------------------------- publish
publish-artifactory:
  stage: publish
  image: curlimages/curl:8.10.1
  <<: *vault_secrets
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - for f in dist/*.tgz dist/SHA256SUMS; do
        curl -sf -H "Authorization: Bearer ${ARTIFACTORY_TOKEN}" -T "$f"
          "${ARTIFACTORY_URL}/${ARTIFACTORY_REPO}/${APP_VERSION}/$(basename "$f");vcs.revision=${CI_COMMIT_SHA};build.url=${CI_PIPELINE_URL}";
      done

# ----------------------------------------------------------------- deploy
# Le déploiement est délégué à AAP : RBAC, credentials Vault, audit, exécution
# depuis la zone réseau autorisée à joindre les serveurs Splunk.
.aap_launch:
  stage: deploy
  image: python:3.12-slim
  <<: *vault_secrets
  script:
    - pip install -q awxkit
    - >
      awx --conf.host "${AAP_URL}" --conf.token "${AAP_TOKEN}" -k
      workflow_job_templates launch "Splunk - deploy apps"
      --extra_vars "{\"target_env\": \"${TARGET_ENV}\", \"app_version\": \"${APP_VERSION}\"}"
      --monitor --timeout 3600

deploy-dev:
  extends: .aap_launch
  variables: { TARGET_ENV: dev }
  environment: { name: dev }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-rec:
  extends: .aap_launch
  variables: { TARGET_ENV: rec }
  environment: { name: recette }
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

deploy-prod:
  extends: .aap_launch
  variables: { TARGET_ENV: prod }
  environment: { name: production }
  needs: [deploy-rec]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
